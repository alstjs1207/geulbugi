<!doctype html><html lang="ko"><meta charset="utf-8"><title>글부기 아이콘 준비</title><style>body{font:16px system-ui;background:#f4f7f5;padding:24px}img{width:360px}canvas{margin:15px;background:#ddd;image-rendering:auto}.icons{display:flex;align-items:center}</style><h1>글부기 · 승인된 원본 아이콘</h1><img id="original" src="geulbugi-original.png"><div class="icons" id="icons"></div><script>
window.prepareIcons=async()=>{const img=document.querySelector('#original');await img.decode();const result={};for(const size of [16,32,48,128,256]){const canvas=document.createElement('canvas');canvas.width=canvas.height=size;const context=canvas.getContext('2d');context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';const pad=size/8;context.drawImage(img,242,242,800,800,pad,pad,size-pad*2,size-pad*2);document.querySelector('#icons').append(canvas);result[size]=canvas.toDataURL('image/png').split(',')[1];}return result;};
</script></html>
